[project]
name = "aquatrack"
version = "0.1.0"
description = "Swim technique analysis from underwater and overhead video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=7.7.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Pose estimation backends are heavy, so they are opt-in: `uv sync --extra pose`
pose = ["ultralytics>=8.4"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquatrack"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
