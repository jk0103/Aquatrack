[project]
name = "aquatrack"
version = "0.1.0"
description = "Swim technique analysis from underwater and overhead video"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=7.7.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Pose estimation backends are heavy, so they are opt-in: `uv sync --extra pose`
pose = ["ultralytics==8.4.210", "rtmlib>=0.0.16", "onnxruntime>=1.20"]
# Optional rewording of feedback and plans by an OpenAI model: `uv sync --extra llm`. Off unless
# AQUATRACK_LLM_PROVIDER=openai; every call is billed. The app is complete without it.
llm = ["openai>=2.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "openai>=2.0",  # only so the adapter's tests can build real SDK requests against a fake transport
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# ultralytics and rtmlib ask for the GUI/contrib OpenCV builds, which would overwrite the
# headless cv2 the app uses. The headless build has everything both need (incl. cv2.dnn).
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aquatrack"]

[tool.ruff]
line-length = 100
# Local, untracked experiment scripts are not part of the package.
extend-exclude = ["experiments"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
