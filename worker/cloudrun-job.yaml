# Cloud Run job for the inference worker. A TEMPLATE: nothing has been created from it.
# Replace PROJECT, REGION, IMAGE and the service account before use, and only after the
# owner approves the provider and budget (docs/GPU_ACCEPTANCE_TEST.md).
#
#   gcloud run jobs replace worker/cloudrun-job.yaml --region REGION
#   gcloud run jobs execute aquatrack-worker --region REGION --wait
#
# Figures in comments are from Google's documentation as read on 2026-11-16.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: aquatrack-worker
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/gpu-zonal-redundancy-disabled: "true"   # jobs support only this
    spec:
      taskCount: 1
      parallelism: 1          # one GPU at a time; the queue itself prevents double work
      template:
        maxRetries: 0         # the queue retries; a crashed task must not rerun blindly
        timeoutSeconds: 1800  # hard stop for one execution (GPU tasks allow up to 12 hours)
        serviceAccountName: aquatrack-worker@PROJECT.iam.gserviceaccount.com
        nodeSelector:
          run.googleapis.com/accelerator: nvidia-l4
        containers:
          - image: REGION-docker.pkg.dev/PROJECT/aquatrack/worker:TAG
            args: ["--drain"]
            resources:
              limits:
                cpu: "4"              # the minimum Cloud Run allows with an L4
                memory: 16Gi          # likewise; temp files count against it (in-memory disk)
                nvidia.com/gpu: "1"
            env:
              - {name: AQUATRACK_ENV, value: staging}
              - {name: AQUATRACK_ALLOW_PRODUCTION_FIREBASE, value: "1"}
              - {name: FIREBASE_PROJECT_ID, value: PROJECT}
              - {name: FIREBASE_STORAGE_BUCKET, value: PROJECT.firebasestorage.app}
              - {name: AQUATRACK_POSE_SOURCE, value: local}
              - {name: AQUATRACK_POSE_DEVICE, value: cuda}
              - {name: AQUATRACK_JOB_TIMEOUT_S, value: "1500"}
              - {name: AQUATRACK_WORKER_MAX_RSS_MB, value: "12000"}
              # No GOOGLE_APPLICATION_CREDENTIALS and no key file: the attached service
              # account is used. It needs roles/datastore.user and object access to the
              # one bucket (roles/storage.objectUser), nothing else.
